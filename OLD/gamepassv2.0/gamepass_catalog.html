<style>
:root {
    --bg: #f0f2f5;
    --card: #ffffff;
    --text: #1d1d1f;
    --text-sec: #86868b;
    --accent: #0071e3;
    --border: #d2d2d7;
    --shadow: 0 4px 12px rgba(0,0,0,0.06);
    --radius: 12px;
}
body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding-bottom: 40px; }
.container { max-width:1400px; margin:0 auto; padding:20px; }

/* Header & Controls */
header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
h1 { margin: 0; font-size: 24px; }
.controls { display:flex; flex-wrap:wrap; gap:12px; padding:16px; background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:20px; align-items: flex-end; }
.field { display:flex; flex-direction:column; gap:6px; flex:1; min-width:180px; }
.field label { font-size:11px; font-weight:700; color:var(--text-sec); text-transform:uppercase; letter-spacing: 0.5px; }
select, input { width:100%; height:40px; border:1px solid var(--border); border-radius:8px; padding:0 10px; font-size:14px; background: #fff; box-sizing: border-box;}
select[multiple] { height:100px; padding:4px; }
.btn { height:40px; padding:0 20px; border-radius:20px; border:1px solid var(--border); background:#fff; cursor:pointer; font-weight:600; color: var(--text); transition: all 0.2s; }
.btn:hover { background: #f5f5f7; border-color: #b0b0b5; }
.btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* Table View */
.table-wrap { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; border: 1px solid rgba(0,0,0,0.05); }
table { width:100%; border-collapse:collapse; font-size:14px; min-width:1000px; }
th { background:#f9f9fa; padding:14px 16px; text-align:left; border-bottom:1px solid var(--border); font-weight:600; color: var(--text-sec); position: sticky; top: 0; z-index: 10; user-select: none; }
td { padding:12px 16px; border-bottom:1px solid #f0f0f0; vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr:hover { background-color: #f9f9fb; }

/* Sorting styles */
th.sortable { cursor: pointer; transition: background 0.2s; }
th.sortable:hover { background: #eaeaea; color: var(--text); }
th.sortable::after { content: '↕'; display: inline-block; margin-left: 6px; font-size: 11px; opacity: 0.3; width: 10px; }
th.sort-asc::after { content: '▲'; opacity: 1; color: var(--accent); }
th.sort-desc::after { content: '▼'; opacity: 1; color: var(--accent); }

/* Images */
img.cover { 
    width: 90px; 
    height: 135px; 
    object-fit: cover; 
    border-radius: 8px; 
    background: #eee; 
    box-shadow: 0 2px 8px rgba(0,0,0,0.1); 
    display: block;
}

/* Badges */
.tier-badge { display: inline-block; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
.tier-AAA { background: #e8f2ff; color: #0071e3; }
.tier-Indie { background: #eafcf3; color: #008a4b; }

.rating-badge { font-weight: 700; color: var(--text); }
.rating-high { color: #008a4b; }
.rating-mid { color: #bf8600; }

/* Tiles View */
.tiles { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:20px; }
.tile { background:var(--card); border-radius:12px; padding:12px; box-shadow:var(--shadow); display:flex; flex-direction:column; transition: transform 0.2s; }
.tile:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(0,0,0,0.12); }
.tile img { width:100%; aspect-ratio:2/3; object-fit:cover; border-radius:8px; margin-bottom:10px; }
.tile-title { font-weight:700; margin-bottom:4px; font-size:15px; line-height: 1.3; }
.tile-meta { font-size:13px; color:var(--text-sec); margin-top:auto; display: flex; justify-content: space-between; align-items: center; padding-top: 8px; }

/* Pagination */
.pagination { display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 24px; padding: 10px; }
.page-info { font-weight: 600; color: var(--text-sec); font-variant-numeric: tabular-nums; }

/* Utility */
.desc-btn { font-size:12px; color:var(--accent); cursor:pointer; background:none; border:none; padding:0; font-weight: 500; }
.desc { display:none; font-size:13px; color:#444; margin-top:6px; line-height:1.5; background: #f9f9fa; padding: 8px; border-radius: 6px; }
.desc.show { display:block; }
.fav { background:none; border:none; font-size:22px; color:#d2d2d7; cursor:pointer; transition: color 0.2s; line-height: 1;}
.fav.on { color:#f5a623; }
.links a { color: var(--accent); text-decoration: none; margin-right: 8px; font-size: 12px; font-weight: 500; }
.links a:hover { text-decoration: underline; }
</style>

const PAGE_SIZE = 50;
let CUR_PAGE = 1;
let FILTERED_LIST = DATA;
// Стан сортування (за замовчуванням - Рейтинг, Спадання)
let SORT = { key: 'rating', asc: false };

// Utils
function esc(s){return (s||"").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
const getFavs=()=>{try{return new Set(JSON.parse(localStorage.getItem("gp_favs")||"[]"))}catch{return new Set()}};
const setFavs=s=>localStorage.setItem("gp_favs",JSON.stringify(Array.from(s)));

// Rendering
function render() {
    // 1. Sorting Logic (виконується перед пагінацією)
    FILTERED_LIST.sort((a, b) => {
        let valA = a[SORT.key];
        let valB = b[SORT.key];
        
        // Обробка чисел (рейтинг, рік, години)
        if (['rating', 'year', 'hours'].includes(SORT.key)) {
            valA = Number(valA) || 0;
            valB = Number(valB) || 0;
        } else {
            // Рядки
            valA = (valA || "").toString().toLowerCase();
            valB = (valB || "").toString().toLowerCase();
        }

        if (valA < valB) return SORT.asc ? -1 : 1;
        if (valA > valB) return SORT.asc ? 1 : -1;
        return 0;
    });

    // Оновлення стрілочок в заголовках
    document.querySelectorAll("th.sortable").forEach(th => {
        th.classList.remove("sort-asc", "sort-desc");
        if(th.dataset.key === SORT.key) {
            th.classList.add(SORT.asc ? "sort-asc" : "sort-desc");
        }
    });

    // 2. Pagination Logic
    const totalPages = Math.ceil(FILTERED_LIST.length / PAGE_SIZE) || 1;
    if (CUR_PAGE > totalPages) CUR_PAGE = totalPages;
    if (CUR_PAGE < 1) CUR_PAGE = 1;
    
    const start = (CUR_PAGE - 1) * PAGE_SIZE;
    const end = start + PAGE_SIZE;
    const pageData = FILTERED_LIST.slice(start, end);

    const favs = getFavs();
    const isTiles = localStorage.getItem("gp_view") === "tiles";

    // 3. View Switching
    document.getElementById("tableView").style.display = isTiles ? "none" : "block";
    document.getElementById("tilesView").style.display = isTiles ? "block" : "none";
    document.getElementById("btnTable").className = isTiles ? "btn" : "btn active";
    document.getElementById("btnTiles").className = isTiles ? "btn active" : "btn";
    
    // 4. Stats & Pagination UI
    document.getElementById("totalCount").innerText = `${FILTERED_LIST.length} ігор`;
    document.getElementById("pageInfo").innerText = `Сторінка ${CUR_PAGE} з ${totalPages}`;
    document.getElementById("btnPrev").disabled = CUR_PAGE === 1;
    document.getElementById("btnNext").disabled = CUR_PAGE === totalPages;
    document.getElementById("pagination").style.display = FILTERED_LIST.length > 0 ? "flex" : "none";

    // 5. Content Generation
    if(isTiles) {
        document.getElementById("tiles").innerHTML = pageData.map(x => `
        <div class="tile">
            <div style="position:relative">
                <img src="${esc(x.image)}" loading="lazy">
                <button class="fav ${favs.has(x.id)?"on":""}" data-id="${x.id}" style="position:absolute;top:6px;right:6px;background:rgba(0,0,0,0.6);border-radius:50%;width:32px;height:32px;padding:0;display:flex;align-items:center;justify-content:center;">★</button>
            </div>
            <div class="tile-title">${esc(x.name)}</div>
            <div class="tile-meta">
                <span>${esc(x.year)}</span>
                ${x.rating ? `<span style="font-weight:bold; color:${x.rating>=80?'#008a4b':'#bf8600'}">★ ${x.rating}</span>` : ''}
            </div>
            <div style="font-size:11px; color:#888; margin-top:4px;">${esc(x.hours ? x.hours+" год." : "")}</div>
        </div>`).join("");
    } else {
        document.getElementById("tbody").innerHTML = pageData.map((x,i) => `
        <tr>
            <td><img src="${esc(x.image)}" class="cover" loading="lazy"></td>
            <td>
                <div style="font-weight:700; font-size:15px; margin-bottom:4px;">${esc(x.name)}</div>
                <button class="fav ${favs.has(x.id)?"on":""}" data-id="${x.id}" style="font-size:20px;">★</button>
                ${x.tier === "AAA" ? '<span class="tier-badge tier-AAA">AAA</span>' : ''}
            </td>
            <td>${esc(x.genre)}</td>
            <td>
                ${x.description ? `<button class="desc-btn" onclick="document.getElementById('d${i}').classList.toggle('show')">Читати опис</button><div id="d${i}" class="desc">${esc(x.description)}</div>` : ""}
            </td>
            <td>
                <div class="rating-badge ${x.rating>=80?'rating-high':(x.rating>=60?'rating-mid':'')}">${esc(x.rating || '-')}</div>
                <div style="font-size:10px; color:#888;">${esc(x.ratingSource)}</div>
            </td>
            <td>${esc(x.year)}</td>
            <td>${esc(x.hours)}</td>
            <td>${esc(x.publisher)}</td>
            <td class="links">
                ${x.wikipedia?`<a href="${esc(x.wikipedia)}" target="_blank">Wiki</a>`:""} 
                ${x.wikidata?`<a href="${esc(x.wikidata)}" target="_blank">WD</a>`:""}
            </td>
        </tr>`).join("");
    }
    
    // Scroll table to top only if navigating pages, not on initial render
    // (Handled by events)
}

// Filters Logic
function applyFilters() {
    const txt = document.getElementById("searchTxt").value.toLowerCase();
    const years = Array.from(document.getElementById("filterYear").selectedOptions).map(o=>o.value);
    const genres = Array.from(document.getElementById("filterGenre").selectedOptions).map(o=>o.value);
    const r = Number(document.getElementById("filterRating").value);
    const f = document.getElementById("filterFav").checked;
    const favs = getFavs();

    FILTERED_LIST = DATA.filter(x => {
        if(txt && !x.name.toLowerCase().includes(txt)) return false;
        if(years.length && !years.includes(x.year)) return false;
        if(genres.length && !x.genre.split(", ").some(g=>genres.includes(g))) return false;
        if(r && (Number(x.rating)||0) < r) return false;
        if(f && !favs.has(x.id)) return false;
        return true;
    });

    CUR_PAGE = 1; 
    render();
}

// Events
document.querySelectorAll("select, input").forEach(e => e.onchange = applyFilters);
document.getElementById("searchTxt").oninput = applyFilters;
document.getElementById("btnReset").onclick = () => {
    document.querySelectorAll("select").forEach(s => Array.from(s.options).forEach(o => o.selected = false));
    document.getElementById("filterRating").value = "";
    document.getElementById("filterFav").checked = false;
    document.getElementById("searchTxt").value = "";
    // Reset sort too
    SORT = { key: 'rating', asc: false };
    applyFilters();
};

document.getElementById("btnTable").onclick = () => { localStorage.setItem("gp_view","table"); render(); };
document.getElementById("btnTiles").onclick = () => { localStorage.setItem("gp_view","tiles"); render(); };

document.getElementById("btnPrev").onclick = () => { CUR_PAGE--; render(); window.scrollTo({top:0, behavior:'smooth'}); };
document.getElementById("btnNext").onclick = () => { CUR_PAGE++; render(); window.scrollTo({top:0, behavior:'smooth'}); };

// Sorting Events
document.querySelectorAll("th.sortable").forEach(th => {
    th.onclick = () => {
        const key = th.dataset.key;
        if (SORT.key === key) {
            SORT.asc = !SORT.asc; // Toggle direction
        } else {
            SORT.key = key;
            SORT.asc = true; // New column starts asc (except maybe rating?)
            if(key === 'rating' || key === 'year') SORT.asc = false; // Numbers usually desc first
        }
        render();
    };
});

document.addEventListener("click", e => {
    if(e.target.classList.contains("fav")) {
        const id = e.target.dataset.id;
        const s = getFavs();
        s.has(id) ? s.delete(id) : s.add(id);
        setFavs(s);
        e.target.classList.toggle("on");
        if(document.getElementById("filterFav").checked) applyFilters();
    }
});

// Init
const years = [...new Set(DATA.map(x=>x.year).filter(Boolean))].sort().reverse();
const genres = [...new Set(DATA.flatMap(x=>x.genre.split(", ")).filter(Boolean))].sort();
document.getElementById("filterYear").innerHTML = years.map(y=>`<option>${y}</option>`).join("");
document.getElementById("filterGenre").innerHTML = genres.map(g=>`<option>${g}</option>`).join("");

render();
</script>
</body>
</html>
